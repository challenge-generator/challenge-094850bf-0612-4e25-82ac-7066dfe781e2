serenity {
  project.name = "Sistema de Evaluación de Crédito - Pruebas BDD"
  test.skip = false
  dry.run = false
  restapi {
    baseurl = "http://localhost:8080"
    console.enabled = true
    output.json = true
    output.xml = true
  }
  requirements {
    types = Story,Feature,Requirement
    depth = 1
    children = 2
  }
  story {
    title.prefix = ""
  }
  test {
    timeout = 120
    threaded = false
  }
  logging {
    level = INFO
    threshold = WARN
  }
  sauce {
    implicit.wait = 3000
    wait.for.timeout = 10000
  }
  browser {
    proxy {
      http = ""
      https = ""
      bypass = []
      driver = null
    }
    maximize.window = true
    accept.insecure.certs = true
  }
  webdriver {
    driver = chrome
    timeouts {
      implicit = 10000
      script = 30000
      page.load = 60000
    }
    chrome {
      switches = "--start-maximized,--no-sandbox,--disable-dev-shm-usage,--disable-gpu"
      prefs {
        profile.default_content_settings.popups = 0
        download.prompt_for_download = false
        download.default_directory = "target/downloads"
      }
    }
    firefox {
      switches = ""
      profile = null
    }
    edge {
      switches = ""
    }
  }
  cucumber {
    output.formats = ["json", "html"]
    snippets = CAMELCASE
    tags = "@wip or @smoke"
    features = "src/test/resources/features"
    glue = ["com.pragma.credito.bdd.steps"]
  }
}

webdriver {
  driver = chrome
  wait.for.timeout = 15000
  implicitly.wait = 10000
}

chrome.switches="--start-maximized,--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--disable-extensions"
chrome.preferences="profile.default_content_settings.popups=0"

junit {
  step.delay = 0
  reports = "target/site/serenity"
}

api {
  baseurl = "http://localhost:8080"
  timeout = 30000
  retry.enabled = true
  retry.attempts = 3
  retry.delay = 1000
}